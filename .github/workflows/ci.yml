name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: twentyfive
          POSTGRES_PASSWORD: twentyfive
          POSTGRES_DB: twentyfive_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U twentyfive"
          --health-interval 5s --health-timeout 3s --health-retries 10
      minio:
        # bitnami/minio starts the server without a custom command (services can't pass one).
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: twentyfive
          MINIO_ROOT_PASSWORD: twentyfive-secret
        ports: ['9002:9000']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:cov
      - run: npm run test:e2e
      - run: npm run build
