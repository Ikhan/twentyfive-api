# Local services for development and tests.
#   docker compose up -d
# Postgres runs on 5433 (not 5432) so it doesn't clash with other local Postgres instances.
name: twentyfive-api

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: twentyfive
      POSTGRES_PASSWORD: twentyfive
      POSTGRES_DB: twentyfive
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U twentyfive -d twentyfive']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible storage for photo uploads during development.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: twentyfive
      MINIO_ROOT_PASSWORD: twentyfive-secret
    ports:
      - '9002:9000' # S3 API
      - '9003:9001' # web console
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
